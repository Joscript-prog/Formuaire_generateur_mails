<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suivi Projets – Tableau</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.3/dist/umd/supabase.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body,html{height:100%}
    th { position: sticky; top: 0; background: rgba(250,250,250,.95); backdrop-filter: blur(3px); }
    .cell-editable{ display:block; min-width:140px; min-height:24px; padding:4px 6px; border:1px solid #e5e7eb; border-radius:6px; background:#fff; white-space:pre-wrap; }
    .cell-editable[contenteditable="true"]:focus { outline:2px solid #2563eb33; border-color:#2563eb; border-radius:6px; }
    .table-wrap{ height: calc(100vh - 180px); overflow:auto; background:#fff; border-radius:16px; box-shadow:0 1px 6px rgba(0,0,0,.06); }
    #dataTable td:nth-child(1), #dataTable th:nth-child(1) { position: sticky; left: 0; z-index: 3; background: #fff; box-shadow: 1px 0 0 #e5e7eb; }
    #dataTable td:nth-child(2), #dataTable th:nth-child(2) { position: sticky; left: 160px; z-index: 3; background: #fff; box-shadow: 1px 0 0 #e5e7eb; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <div class="max-w-full p-3 space-y-3">
    <header class="flex items-center justify-between gap-3 flex-wrap">
      <nav class="flex items-center gap-2">
        <span class="px-3 py-1 rounded-xl bg-slate-800 text-white shadow">Suivi</span>
        <a href="planification.html" class="px-3 py-1 rounded-xl bg-slate-200 text-slate-900 shadow">Planification</a>
        <a href="outil_mail.html" class="px-3 py-1 rounded-xl bg-slate-200 text-slate-900 shadow" target="_blank" rel="noopener">Générateur</a>
      </nav>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="importBtn" class="px-3 py-1 rounded-xl bg-indigo-600 text-white shadow">Importer</button>
        <button id="pasteBtn" class="px-3 py-1 rounded-xl bg-fuchsia-600 text-white shadow">Coller Excel</button>
        <button id="addRowBtn" class="px-3 py-1 rounded-xl bg-slate-700 text-white shadow">Ajouter une ligne</button>
        <button id="exportBtn" class="px-3 py-1 rounded-xl bg-amber-600 text-white shadow">Exporter CSV</button>
        <button id="resetBtn" class="px-3 py-1 rounded-xl bg-rose-600 text-white shadow">Réinitialiser (local)</button>
        <span class="grow"></span>
        <input id="emailAuth" class="px-2 py-1 border rounded" placeholder="email pour login" />
        <button id="loginBtn" class="px-3 py-1 rounded-xl bg-blue-600 text-white">Login</button>
        <button id="logoutBtn" class="px-3 py-1 rounded-xl bg-gray-600 text-white">Logout</button>
      </div>
    </header>

    <section class="bg-white rounded-2xl shadow p-2">
      <input id="search" class="px-3 py-1 rounded-xl border w-full mb-2" placeholder="Recherche (site, code, OT, commentaire…)" />
    </section>

    <section class="bg-white rounded-2xl shadow p-2">
      <div class="flex flex-wrap gap-2 items-center">
        <select id="fTypologie" class="border rounded px-2 py-1">
          <option value="">Typologie (toutes)</option>
          <option>SITE ISOLE</option>
          <option>SITE MITOYEN</option>
        </select>
        <select id="fTravaux" class="border rounded px-2 py-1">
          <option value="">Type Travaux (tous)</option>
          <option>INFRA</option>
          <option>ROCADE</option>
          <option>INFRA ET ROCADE</option>
        </select>
        <select id="fStatutTrav" class="border rounded px-2 py-1">
          <option value="">Statut Travaux (tous)</option>
          <option>REALISE</option>
          <option>EN COURS</option>
          <option>PAS BESOIN</option>
        </select>
        <button id="clearFilters" class="ml-auto px-3 py-1 rounded bg-slate-100">Réinitialiser</button>
      </div>
    </section>

    <section class="table-wrap">
      <table class="min-w-full text-xs" id="dataTable">
        <thead><tr id="theadRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </div>

<script>
(function(){
  // ====== CONFIG SUPABASE ======
  const SUPABASE_URL = "REMPLACE-MOI";
  const SUPABASE_KEY = "REMPLACE-MOI";
  const supa = (SUPABASE_URL && SUPABASE_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  // ====== Constantes / colonnes ======
  const STORAGE_KEY = 'suivi_projets_data_v2';
  const HEADERS = [
    'CODE SITE','NOM DU SITE','OT AUDIT','TYPOLOGIE',"TYPE D'AUDIT",'DATES AUDITS','STATUT','CR REALISES','CHIFFRAGES','OT TRAVAUX','DATES TRAVAUX','TYPE DE TRAVAUX','STATUT TRAVAUX','CR REALISES2','COMMENTAIRES',
    'DATE INFRA','DATES INFRA','DATE ROCADE','DATES ROCADE','LIEN','TYPE LIEN'
  ];

  // ====== État ======
  let rows = [];                    // tableau ordonné pour l’affichage
  const rowMap = new Map();         // id -> payload
  let realtimeChannel = null;

  // ====== DOM ======
  const tbody = document.getElementById('tbody');
  const theadRow = document.getElementById('theadRow');
  const search = document.getElementById('search');
  const fTypologie = document.getElementById('fTypologie');
  const fTravaux = document.getElementById('fTravaux');
  const fStatutTrav = document.getElementById('fStatutTrav');
  const clearFilters = document.getElementById('clearFilters');

  // ====== UI helpers ======
  function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;"," >":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
  function genId(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
  function badge(status){
    const raw = (status==null? '': String(status)).trim();
    if(!raw) return '';
    const s = raw.toUpperCase();
    let cls = 'bg-slate-200 text-slate-800';
    if(s.includes('REALISE')) cls = 'bg-emerald-200 text-emerald-900';
    else if(s.includes('EN COURS')) cls = 'bg-amber-200 text-amber-900';
    else if(s.includes('PAS BESOIN')) cls = 'bg-blue-200 text-blue-900';
    return `<span class="text-[10px] px-2 py-0.5 rounded-full ${cls}">${escapeHtml(raw)}</span>`;
  }

  // ====== Header ======
  function buildHeader(){
    const ths = HEADERS.map(h=>`<th class="p-1 text-left whitespace-nowrap">${h}</th>`);
    ths.push('<th class="p-1 text-left whitespace-nowrap">Actions</th>');
    theadRow.innerHTML = ths.join('');
  }
  buildHeader();

  // ====== Rendu ======
  function detectTravauxType(r){
    const di = (r['DATE INFRA']||r['DATES INFRA']||'').toString().trim();
    const dr = (r['DATE ROCADE']||r['DATES ROCADE']||'').toString().trim();
    if(di && dr) return 'infra_rocade';
    if(di) return 'infra';
    if(dr) return 'rocade';
    const src = (r['TYPE DE TRAVAUX']||'').toString().toUpperCase();
    if(src.includes('INFRA') && (src.includes('ROCADE')||src.includes('ROCA'))) return 'infra_rocade';
    if(src.includes('INFRA')) return 'infra';
    if(src.includes('ROCADE')||src.includes('ROCA')) return 'rocade';
    const com = (r['COMMENTAIRES']||'').toString().toUpperCase();
    if(com.includes('TRAVAUX')){
      if(com.includes('INFRA') && com.includes('ROCADE')) return 'infra_rocade';
      if(com.includes('INFRA')) return 'infra';
      if(com.includes('ROCADE')||com.includes('LIEN')) return 'rocade';
      return 'infra';
    }
    return 'audit_baie_lien';
  }
  function detectLien(r){
    const direct = (r['LIEN']||r['TYPE LIEN']||'').toString().trim();
    if(direct) return direct;
    const inAudit  = (r["TYPE D'AUDIT"]||'').toString().toUpperCase();
    const inTrav   = (r['TYPE DE TRAVAUX']||'').toString().toUpperCase();
    const com = (r['COMMENTAIRES']||'').toString().toUpperCase();
    if(inAudit.includes('LIEN')||inTrav.includes('LIEN')||com.includes('LIEN')) return 'FTTO';
    return '';
  }

  function applyFilters(data){
    const q = search.value.trim().toLowerCase();
    if(q){ data = data.filter(r => HEADERS.some(h => String(r[h]||'').toLowerCase().includes(q))); }
    if (fTypologie && fTypologie.value) {
      const v = fTypologie.value.toUpperCase();
      data = data.filter(r => (r['TYPOLOGIE']||'').toString().toUpperCase().includes(v));
    }
    if (fTravaux && fTravaux.value) {
      const v = fTravaux.value.toUpperCase();
      data = data.filter(r => {
        const t = detectTravauxType(r);
        if (v==='INFRA ET ROCADE') return t==='infra_rocade';
        if (v==='INFRA') return t==='infra';
        if (v==='ROCADE') return t==='rocade';
        return true;
      });
    }
    if (fStatutTrav && fStatutTrav.value) {
      const v = fStatutTrav.value.toUpperCase();
      data = data.filter(r => (r['STATUT TRAVAUX']||'').toString().toUpperCase().includes(v));
    }
    return data;
  }

  function render(){
    let data = rows.slice();
    data = applyFilters(data);
    tbody.innerHTML = data.map(r => {
      const tds = HEADERS.map(h => {
        const isStatus = (h==='STATUT' || h==='STATUT TRAVAUX');
        const editable = isStatus ? badge(r[h]) :
          `<div class="cell-editable" contenteditable="true" tabindex="0" spellcheck="false" data-id="${r.__id}" data-key="${h}">${escapeHtml(r[h]||'')}</div>`;
        return `<td class="p-1 align-top whitespace-nowrap" data-col="${h}">${editable}</td>`;
      });
      tds.push(`<td class="p-1 align-top">
        <button class="px-2 py-1 rounded bg-indigo-600 text-white" data-action="gen" data-id="${r.__id}">Générer</button>
        <button class="ml-1 px-2 py-1 rounded bg-gray-600 text-white" data-action="dupe" data-id="${r.__id}">Dupliquer</button>
        <button class="ml-1 px-2 py-1 rounded bg-rose-600 text-white" data-action="del" data-id="${r.__id}">Supprimer</button>
      </td>`);
      return `<tr class="border-b">${tds.join('')}</tr>`;
    }).join('');
  }

  // ====== Local fallback ======
  function saveLocal(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); }
  function loadLocal(){ const s = localStorage.getItem(STORAGE_KEY); if(s){ try{ rows = JSON.parse(s)||[]; rows.forEach(r=>rowMap.set(r.__id, r)); }catch{} } }

  // ====== Supabase helpers (per-row) ======
  async function upsertRow(r){
    if(!supa) { saveLocal(); return; }
    await supa.from('suivi_rows').upsert({ id: r.__id, payload: r });
  }
  async function deleteRow(id){
    if(!supa) {
      rows = rows.filter(x=>x.__id!==id);
      rowMap.delete(id);
      saveLocal(); render();
      return;
    }
    await supa.from('suivi_rows').delete().eq('id', id);
  }

  // ====== Init/Load + Realtime ======
  async function load(){
    if(!supa){
      loadLocal(); render(); return;
    }
    const { data, error } = await supa.from('suivi_rows').select('id,payload').order('updated_at',{ascending:true});
    if(error){ console.warn(error); loadLocal(); return render(); }
    rows = (data||[]).map(x=>{
      const r = x.payload; r.__id = r.__id || x.id; return r;
    });
    rowMap.clear(); rows.forEach(r=>rowMap.set(r.__id, r));
    render();

    // Realtime
    if(realtimeChannel) supa.removeChannel(realtimeChannel);
    realtimeChannel = supa.channel('suivi_rows_changes')
      .on('postgres_changes', { event: '*', schema:'public', table:'suivi_rows' }, (payload)=>{
        if(payload.eventType==='INSERT' || payload.eventType==='UPDATE'){
          const r = payload.new.payload; r.__id = r.__id || payload.new.id;
          rowMap.set(r.__id, r);
          const idx = rows.findIndex(x=>x.__id===r.__id);
          if(idx>=0) rows[idx] = r; else rows.push(r);
          render();
        } else if(payload.eventType==='DELETE'){
          const id = payload.old.id;
          rowMap.delete(id);
          rows = rows.filter(x=>x.__id!==id);
          render();
        }
      }).subscribe();
  }

  // ====== Actions UI ======
  function addEmptyRow(){
    const r = { __id: genId() }; HEADERS.forEach(h => r[h] = '');
    rows.unshift(r); rowMap.set(r.__id, r);
    upsertRow(r); render();
  }

  // parse de collage
  function parseTable(text){
    const hasTab = text.includes('\t');
    const first = text.split('\n')[0]||'';
    const sep = hasTab ? '\t' : (first.includes(';') ? ';' : ',');
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    const data = lines.map(line => {
      if(hasTab){ return line.split('\t'); }
      const out=[]; let cur=''; let inQ=false;
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
        else if(c===sep && !inQ){ out.push(cur); cur=''; }
        else cur+=c;
      }
      out.push(cur);
      return out;
    });
    return data;
  }
  function looksLikeHeader(arr){
    const upper = arr.map(x => (x||'').toString().trim().toUpperCase());
    let matches = 0; for(const h of HEADERS){ if(upper.includes(h)) matches++; }
    return matches >= 3;
  }

  // Écoutes
  document.getElementById('addRowBtn').addEventListener('click', addEmptyRow);

  document.getElementById('importBtn').addEventListener('click', async ()=>{
    const txt = prompt('Collez ici les données copiées depuis Excel/SharePoint'); if(!txt) return;
    const table = parseTable(txt); if(!table.length) return;
    let newRows = [];
    if(looksLikeHeader(table[0])){
      const head = table[0]; const idx = HEADERS.map(h => head.findIndex(x => (x||'').toString().trim().toUpperCase()===h));
      newRows = table.slice(1).map(src => {
        const r = { __id: genId() }; HEADERS.forEach((h,j)=>{ const i = idx[j]; r[h] = i>=0 ? (src[i]||'').trim() : ''; }); return r;
      });
    } else {
      newRows = table.map(src => { const r = { __id: genId() }; HEADERS.forEach((h,j)=> r[h] = (src[j]||'').trim()); return r; });
    }
    for(const r of newRows){ rows.push(r); rowMap.set(r.__id, r); await upsertRow(r); }
    render();
  });

  const pasteBtn = document.getElementById('pasteBtn');
  const pasteModal = null; // retiré
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const lines = [HEADERS.join(';')];
    for(const r of rows){
      const row = HEADERS.map(h => '"'+String(r[h]||'').replaceAll('"','""')+'"').join(';');
      lines.push(row);
    }
    const csv = lines.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'suivi_projets.csv'; a.click(); URL.revokeObjectURL(url);
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{ if(confirm('Ça ne vide que le stockage local. Les données DB restent. Continuer ?')){ localStorage.removeItem(STORAGE_KEY); alert('LocalStorage vidé.'); } });

  search.addEventListener('input', render);
  [fTypologie,fTravaux,fStatutTrav].forEach(el=> el && el.addEventListener('change', render));
  clearFilters && clearFilters.addEventListener('click', ()=>{ fTypologie.value=''; fTravaux.value=''; fStatutTrav.value=''; render(); });

  // Inline edit
  tbody.addEventListener('click', (e)=>{ if(e.target.closest('button')) return; const td = e.target.closest('td'); if(!td) return; const box = td.querySelector('.cell-editable'); if(box) box.focus(); });
  tbody.addEventListener('input', async (e)=>{
    const el = e.target.closest('.cell-editable'); if(!el) return;
    const id = el.dataset.id; const key = el.dataset.key; const r = rowMap.get(id);
    if(r){ r[key] = el.innerText.trim(); await upsertRow(r); }
  });

  // Collage dans cellule
  tbody.addEventListener('paste', async (e)=>{
    const cell = e.target.closest('.cell-editable'); if(!cell) return;
    const text = (e.clipboardData || window.clipboardData).getData('text'); if(!text) return;
    if(!text.includes('\t') && !text.includes('\n') && !text.includes(';') && !text.includes(',')) return;
    e.preventDefault();
    const table = parseTable(text);
    const startKey = cell.dataset.key;
    const startId  = cell.dataset.id;
    const startCol = HEADERS.indexOf(startKey);
    const startRowIndex = rows.findIndex(r => r.__id===startId);
    const toUpsert = [];
    for(let rIdx=0; rIdx<table.length; rIdx++){
      const srcRow = table[rIdx];
      const targetIndex = startRowIndex + rIdx;
      if(!rows[targetIndex]){ const nr = { __id: genId() }; HEADERS.forEach(h => nr[h] = ''); rows.push(nr); rowMap.set(nr.__id, nr); }
      const tgt = rows[targetIndex];
      for(let c=0; c<srcRow.length && (startCol+c)<HEADERS.length; c++){
        const h = HEADERS[startCol+c]; tgt[h] = (srcRow[c]||'').trim();
      }
      toUpsert.push(tgt);
    }
    for(const r of toUpsert){ await upsertRow(r); }
    render();
  });

  // Boutons ligne
  tbody.addEventListener('click', async (e)=>{
    const btn = e.target.closest('button[data-action]'); if(!btn) return;
    const id = btn.dataset.id; const r = rowMap.get(id); if(!r) return;
    const act = btn.dataset.action;
    if(act==='dupe'){
      const copy = JSON.parse(JSON.stringify(r)); copy.__id = genId(); rows.unshift(copy); rowMap.set(copy.__id, copy); await upsertRow(copy); render();
    } else if(act==='del'){
      if(confirm('Supprimer cette ligne ?')){ await deleteRow(id); }
    } else if(act==='gen'){
      const type = (()=>{
        const di = (r['DATE INFRA']||r['DATES INFRA']||'').toString().trim();
        const dr = (r['DATE ROCADE']||r['DATES ROCADE']||'').toString().trim();
        if(di && dr) return 'infra_rocade';
        if(di) return 'infra';
        if(dr) return 'rocade';
        const src = (r['TYPE DE TRAVAUX']||'').toString().toUpperCase();
        if(src.includes('INFRA') && (src.includes('ROCADE')||src.includes('ROCA'))) return 'infra_rocade';
        if(src.includes('INFRA')) return 'infra';
        if(src.includes('ROCADE')||src.includes('ROCA')) return 'rocade';
        return 'audit_baie_lien';
      })();
      const typRaw = (r['TYPOLOGIE']||'').toString().toUpperCase();
      const typologieForm = typRaw.includes('ISOLE') ? 'SITE ISOLE' : 'SITE MITOYEN';
      const isTrav = (type==='infra'||type==='rocade'||type==='infra_rocade');
      const ticketVal = isTrav ? (r['OT TRAVAUX']||'') : (r['OT AUDIT']||'');
      const villeVal = (r['NOM DU SITE']||'').replace(/^\s*\d+[\s_\-]*/, '').split(' - ')[0].replace(/MARIE\s+BLACH[ÈE]RE|MANGEONS\s+FRAIS/gi,'').replace(/\s{2,}/g,' ').trim().toUpperCase();
      const lienVal  = (r['LIEN']||'') || detectLien(r);
      const params = new URLSearchParams({
        type, ticket: ticketVal, date: isTrav ? (r['DATES TRAVAUX']||'') : (r['DATES AUDITS']||''),
        ville: villeVal, typologie: typologieForm, raison: (r['NOM DU SITE']||''), lien: lienVal
      });
      const target = new URL('outil_mail.html', location.href);
      target.search = params.toString();
      const a = document.createElement('a'); a.href = target.toString(); a.target = '_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
    }
  });

  // Auth boutons
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('emailAuth').value.trim();
    if(!email) return alert('Entre un email.');
    const { error } = await supa.auth.signInWithOtp({ email });
    if(error) alert('Login error: '+error.message); else alert('Lien magique envoyé.');
  });
  document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await supa.auth.signOut(); alert('Déconnecté.'); load(); });

  (async function init(){ await load(); })();
})();
</script>
</body>
</html>
